<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add a default marker</title>
    <meta property="og:description" content="Add a default marker to the map." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.13.0/dist/maplibre-gl.js'></script>
    <style>
        body { margin: 0; padding: 0; }
        html, body, #map { height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [17.00, 49.5],
        zoom: 8
    });

    const marker0 = new maplibregl.Marker()
        .setLngLat([17.00, 49.5])
        .addTo(map);
    
    const marker1 = new maplibregl.Marker()
        .setLngLat([18.00, 48.5])
        .addTo(map);
    
    const marker2 = new maplibregl.Marker()
        .setLngLat([16.00, 50.5])
        .addTo(map);
    
    const marker3 = new maplibregl.Marker()
        .setLngLat([19.00, 47.5])
        .addTo(map);
    
    const marker4 = new maplibregl.Marker()
        .setLngLat([15.00, 51.5])
        .addTo(map);
</script>
</body>
</html>
